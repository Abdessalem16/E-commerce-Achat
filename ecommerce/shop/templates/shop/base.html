
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donald-Shop</title>

    <!-- Bootstrap 4 -->
    <link
        rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    >

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <!-- Style personnalisé -->
    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar-custom {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            padding: 12px 20px;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #198754 !important;
        }

        .nav-link {
            font-weight: 500;
            color: #333 !important;
            margin-right: 10px;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: #198754 !important;
        }

        /* Panier */
        .btn-panier {
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-weight: 500;
        }

        .btn-panier:hover {
            background-color: #146c43;
            color: white;
        }

        /* Dropdown */
        .dropdown-menu {
            border: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            border-radius: 10px;
        }

        .dropdown-item:hover {
            background-color: #f1f8f4;
            color: #198754;
        }

        /* Contenu */
        .main-container {
            padding-top: 30px;
            padding-bottom: 50px;
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- NAVBAR -->
        <div class="row mt-3">

            <div class="col-md-12">

                <nav class="navbar navbar-expand-lg navbar-custom">

                    <!-- Logo -->
                    <a
                        class="navbar-brand"
                        href="{% url 'home' %}"
                    >
                        🛍️ Donald-Shop
                    </a>


                    <!-- Bouton mobile -->
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-toggle="collapse"
                        data-target="#navbarNavDropdown"
                        aria-controls="navbarNavDropdown"
                        aria-expanded="false"
                        aria-label="Navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>


                    <!-- Menu -->
                    <div
                        class="collapse navbar-collapse"
                        id="navbarNavDropdown"
                    >

                        <ul class="navbar-nav ml-auto align-items-lg-center">

                            <!-- Accueil -->
                            <li class="nav-item">
                                <a
                                    class="nav-link"
                                    href="{% url 'home' %}"
                                >
                                    Accueil
                                </a>
                            </li>


                            <!-- Produits -->
                            <li class="nav-item">
                                <a
                                    class="nav-link"
                                    href="{% url 'home' %}"
                                >
                                    Produits
                                </a>
                            </li>


                            <!-- Panier -->
                            <li class="nav-item mr-2">

                                <button
                                    id="panier"
                                    type="button"
                                    class="btn btn-panier"
                                    data-html="true"
                                    data-container="body"
                                    data-toggle="popover"
                                    data-placement="bottom"
                                    data-content="Votre panier est vide."
                                >
                                    🛒 Panier (0)
                                </button>

                            </li>


                            <!-- Catégories -->
                            <li class="nav-item dropdown">

                                <a
                                    class="nav-link dropdown-toggle"
                                    href="#"
                                    id="navbarDropdownMenuLink"
                                    data-toggle="dropdown"
                                    aria-haspopup="true"
                                    aria-expanded="false"
                                >
                                    Catégories
                                </a>

                                <div
                                    class="dropdown-menu dropdown-menu-right"
                                    aria-labelledby="navbarDropdownMenuLink"
                                >

                                    <a
                                        class="dropdown-item"
                                        href="#"
                                    >
                                        Ordinateurs
                                    </a>

                                    <a
                                        class="dropdown-item"
                                        href="#"
                                    >
                                        Téléphones
                                    </a>

                                    <a
                                        class="dropdown-item"
                                        href="#"
                                    >
                                        Accessoires
                                    </a>

                                </div>

                            </li>

                        </ul>

                    </div>

                </nav>

            </div>

        </div>


        <!-- CONTENU DES PAGES -->
        <main class="main-container">

            {% block content %}

            {% endblock %}

        </main>

    </div>


    <!-- JAVASCRIPT DES PAGES -->
    {% block js %}

    {% endblock %}


    <!-- Activation des popovers -->
    <script>

        $(document).ready(function () {

            $('[data-toggle="popover"]').popover();

        });

    </script>

</body>

</html>
```
