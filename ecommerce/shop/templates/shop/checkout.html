{% extends "shop/base.html" %}

{% block content %}

<div class="container py-4">

    <!-- Titre -->
    <div class="text-center mb-4">
        <h2 class="font-weight-bold">
            Finaliser votre commande
        </h2>
        <p class="text-muted">
            Vérifiez votre panier puis renseignez vos informations de livraison.
        </p>
    </div>


    <div class="row">

        <!-- LISTE DU PANIER -->
        <div class="col-lg-7 mb-4">

            <div class="card border-0 shadow-sm rounded-lg">

                <div class="card-header bg-white border-0 pt-4">
                    <h4 class="font-weight-bold mb-0">
                        🛒 Votre panier
                    </h4>
                </div>

                <div class="card-body">

                    <ul class="list-group list-group-flush" id="item-list">

                    </ul>

                </div>

            </div>

        </div>


        <!-- FORMULAIRE -->
        <div class="col-lg-5">

            <div class="card border-0 shadow-sm rounded-lg">

                <div class="card-header bg-white border-0 pt-4">
                    <h4 class="font-weight-bold">
                        📦 Informations de livraison
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Panier caché -->
                        <input type="hidden" id="items" name="items">


                        <!-- Nom -->
                        <div class="form-group">
                            <label for="nom">
                                Nom complet
                            </label>

                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                class="form-control"
                                placeholder="Votre nom"
                                required
                            >
                        </div>


                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">
                                Adresse email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="exemple@email.com"
                                required
                            >
                        </div>


                        <!-- Adresse -->
                        <div class="form-group">
                            <label for="address">
                                Adresse
                            </label>

                            <input
                                type="text"
                                id="address"
                                name="address"
                                class="form-control"
                                placeholder="Votre adresse"
                                required
                            >
                        </div>


                        <div class="form-row">

                            <!-- Ville -->
                            <div class="form-group col-md-6">

                                <label for="ville">
                                    Ville
                                </label>

                                <input
                                    type="text"
                                    name="ville"
                                    id="ville"
                                    class="form-control"
                                    placeholder="Ex: Tunis"
                                    required
                                >

                            </div>


                            <!-- Pays -->
                            <div class="form-group col-md-6">

                                <label for="pays">
                                    Pays
                                </label>

                                <select
                                    id="pays"
                                    name="pays"
                                    class="form-control"
                                >

                                    <option selected>
                                        Tunisie
                                    </option>

                                    <option>
                                        France
                                    </option>

                                    <option>
                                        Canada
                                    </option>

                                    <option>
                                        Italie
                                    </option>

                                    <option>
                                        Burkina Faso
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- Code postal -->
                        <div class="form-group">

                            <label for="zipcode">
                                Code postal
                            </label>

                            <input
                                name="zipcode"
                                id="zipcode"
                                type="text"
                                class="form-control"
                                placeholder="Ex: 4000"
                                required
                            >

                        </div>


                        <!-- TOTAL -->
                        <div class="bg-light rounded p-3 mt-4 mb-4">

                            <div class="d-flex justify-content-between align-items-center">

                                <span class="font-weight-bold">
                                    Total à payer
                                </span>

                                <input
                                    name="total"
                                    id="total"
                                    type="text"
                                    class="form-control text-success font-weight-bold text-right"
                                    readonly
                                    style="max-width: 150px; font-size: 20px;"
                                >

                            </div>

                        </div>


                        <!-- BOUTON -->
                        <button
                            type="submit"
                            class="btn btn-success btn-block btn-lg"
                        >
                            Confirmer la commande
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block js %}

<script type="text/javascript">

    // Récupération du panier
    if (localStorage.getItem('panier') == null) {

        var panier = {};

    } else {

        panier = JSON.parse(
            localStorage.getItem('panier')
        );

    }


    var total = 0;
    var nombre = 0;


    // Affichage des produits
    for (item in panier) {

        let nom = panier[item][1];
        let quantite = panier[item][0];
        let prix = panier[item][2];

        nombre += quantite;
        total += prix;


        let itemString = `

            <li class="list-group-item
                       d-flex
                       justify-content-between
                       align-items-center
                       border-0
                       border-bottom">

                <div>
                    <strong>${nom}</strong>
                </div>

                <div>

                    <span class="badge badge-secondary badge-pill mr-2">
                        QTE: ${quantite}
                    </span>

                    <span class="badge badge-success badge-pill">
                        ${prix.toFixed(2)} DT
                    </span>

                </div>

            </li>

        `;


        $('#item-list').append(itemString);

    }


    // Résumé total
    let itemNombre = `

        <li class="list-group-item
                   d-flex
                   justify-content-between
                   align-items-center
                   bg-light
                   font-weight-bold
                   mt-2">

            <span>
                TOTAL
            </span>

            <div>

                <span class="badge badge-info badge-pill mr-2">
                    ${nombre} article(s)
                </span>

                <span class="text-success">
                    ${total.toFixed(2)} DT
                </span>

            </div>

        </li>

    `;


    $('#item-list').append(itemNombre);


    // Afficher le total dans le formulaire
    $('#total').val(
        total.toFixed(2) + " DT"
    );


    // Envoyer le panier au serveur Django
    $('#items').val(
        JSON.stringify(panier)
    );

</script>

{% endblock %}
